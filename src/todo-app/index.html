<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tasks</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3a4a8a" />

  <!-- iOS Safari does not fully honor manifest.json for Home Screen installs
       — these are what actually get it to launch full-screen with no
       browser chrome, using its own Home Screen icon and title. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tasks" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
</head>
<body>
  <main class="app">
    <h1>Tasks</h1>

    <div class="storage-error" data-testid="storage-error" role="alert" hidden></div>

    <form class="new-task-form" data-testid="new-task-form">
      <input
        type="text"
        name="text"
        data-testid="new-task-text"
        placeholder="Add a task…"
        aria-label="Task text"
        required
      />
      <input
        type="text"
        name="description"
        data-testid="new-task-description"
        placeholder="Description (optional)"
        aria-label="Task description (optional)"
      />
      <select name="urgency" data-testid="new-task-urgency" aria-label="Urgency">
        <option value="red">Urgent</option>
        <option value="yellow">Medium</option>
        <option value="green" selected>Chill</option>
      </select>

      <fieldset class="date-fields">
        <legend>Date (optional)</legend>
        <input type="date" data-testid="new-task-date" aria-label="Date" />
      </fieldset>

      <fieldset class="recurrence-fields">
        <legend>Or repeat on (optional)</legend>
        <span class="weekday-picker" role="group" aria-label="Repeat on weekdays">
          <label><input type="checkbox" data-testid="new-task-weekday" value="0" /> Sun</label>
          <label><input type="checkbox" data-testid="new-task-weekday" value="1" /> Mon</label>
          <label><input type="checkbox" data-testid="new-task-weekday" value="2" /> Tue</label>
          <label><input type="checkbox" data-testid="new-task-weekday" value="3" /> Wed</label>
          <label><input type="checkbox" data-testid="new-task-weekday" value="4" /> Thu</label>
          <label><input type="checkbox" data-testid="new-task-weekday" value="5" /> Fri</label>
          <label><input type="checkbox" data-testid="new-task-weekday" value="6" /> Sat</label>
        </span>
        <input type="date" data-testid="new-task-start-date" aria-label="Repeat start date" />
        <input type="date" data-testid="new-task-end-date" aria-label="Repeat end date" />
      </fieldset>

      <button type="submit">Add</button>
      <div class="form-error" data-testid="new-task-error" role="alert" hidden></div>
    </form>

    <ul class="task-list" data-testid="task-list"></ul>

    <h2>Scheduled</h2>
    <ul class="scheduled-list" data-testid="scheduled-list"></ul>

    <h2>Calendar</h2>
    <div class="calendar" data-testid="calendar">
      <div class="calendar-controls">
        <span class="calendar-view-switcher" role="group" aria-label="Calendar view">
          <button type="button" data-testid="calendar-view-month" aria-label="Month view">Month</button>
          <button type="button" data-testid="calendar-view-week" aria-label="Week view">Week</button>
          <button type="button" data-testid="calendar-view-year" aria-label="Year view">Year</button>
        </span>
        <span class="calendar-nav" role="group" aria-label="Calendar navigation">
          <button type="button" data-testid="calendar-nav-prev" aria-label="Previous period">‹</button>
          <button type="button" data-testid="calendar-nav-today" aria-label="Today">Today</button>
          <button type="button" data-testid="calendar-nav-next" aria-label="Next period">›</button>
        </span>
      </div>
      <div class="calendar-grid" data-testid="calendar-grid"></div>
    </div>

    <div class="day-detail" data-testid="day-detail" hidden>
      <button type="button" class="day-detail-close" data-testid="day-detail-close" aria-label="Close">×</button>
      <div class="day-detail-body" data-testid="day-detail-body"></div>
    </div>

    <div class="reminder-popup" data-testid="reminder-popup" hidden>
      <p data-testid="reminder-popup-text"></p>
      <input type="text" data-testid="reminder-edit-text" aria-label="Reminder text" />
      <select data-testid="reminder-edit-color" aria-label="Reminder color">
        <option value="green">Green</option>
        <option value="yellow">Yellow</option>
      </select>
      <input type="date" data-testid="reminder-edit-date" aria-label="Reminder date" />
      <button type="button" data-testid="reminder-save">Save</button>
      <button type="button" data-testid="reminder-delete">Delete</button>
      <div class="form-error" data-testid="reminder-edit-error" role="alert" hidden></div>
    </div>

    <h2>Reminders</h2>
    <form class="new-reminder-form" data-testid="new-reminder-form">
      <input
        type="text"
        name="text"
        data-testid="new-reminder-text"
        placeholder="Reminder text…"
        aria-label="Reminder text"
      />
      <select name="color" data-testid="new-reminder-color" aria-label="Reminder color">
        <option value="green" selected>Green</option>
        <option value="yellow">Yellow</option>
      </select>
      <input type="date" name="date" data-testid="new-reminder-date" aria-label="Reminder date" required />
      <button type="submit">Add reminder</button>
      <div class="form-error" data-testid="new-reminder-error" role="alert" hidden></div>
    </form>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
